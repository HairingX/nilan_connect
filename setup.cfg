[metadata]
name = nilan_connect
version = attr: nilan_connect.__version__
author = HairingX
license = MIT
description = Event-driven, async client for Nilan ventilation units behind a Nilan gateway: every value typed, and told when it changes - over micro_nabto.
keywords = nilan, cts400, ventilation, micro_nabto, nabto, asyncio
url = https://github.com/HairingX/nilan_connect_lib
project_urls =
    Source = https://github.com/HairingX/nilan_connect_lib
    Issues = https://github.com/HairingX/nilan_connect_lib/issues
    Releases = https://github.com/HairingX/nilan_connect_lib/releases
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 3 - Alpha
    Framework :: AsyncIO
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Topic :: Software Development :: Libraries
    Topic :: Home Automation
    Typing :: Typed

[options]
python_requires = >=3.12
packages = find:
package_dir =
    =src
zip_safe = False
install_requires =
    modbus_event_connect >=0.2.1,<0.3

[options.packages.find]
where=src

[options.package_data]
# PEP 561: tells a type checker the package ships its own types, so a consumer does not have
# to silence the import.
nilan_connect = py.typed
