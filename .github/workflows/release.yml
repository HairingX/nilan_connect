name: Release

# Run this from the Actions tab, on main, once the maintainer has approved the draft release and
# its version. Never publish the draft release by hand: the package takes its version from the
# tag, and only this workflow tags a tested commit.
#
# The file name matters: PyPI trusted publishing is bound to this repository, this workflow file
# and the pypi environment, and takes no reusable workflow, so the upload runs here.
#
# The workflows and the tools are shared by every library of the owner, from
# HairingX/workflows; this file is a copy of its template and is checked to stay so.
on:
  workflow_dispatch:
    inputs:
      release:
        description: >-
          What to release. The version is worked out from the tags, PyPI and the draft release:
          the next release candidate, or the final release that ends the series.
        required: true
        type: choice
        options:
          - release candidate
          - final release
        default: release candidate
      version:
        description: >-
          Override, only for a new major version, which is never worked out, or when the version
          worked out is wrong: canonical PEP 440 without a v, such as 1.0.0 or 1.0.0rc1, of the
          kind chosen above. It must still be higher than every version tagged or on PyPI.
        required: false
        type: string

permissions: {}

# GitHub keeps one waiting run per group: a third dispatch cancels the one waiting.
concurrency:
  group: release
  cancel-in-progress: false

# The shell given explicitly, so GitHub runs every step with pipefail.
defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release
    permissions:
      contents: write
      pull-requests: read
      actions: read
    uses: HairingX/workflows/.github/workflows/python-release.yml@v2
    with:
      release: ${{ inputs.release }}
      version: ${{ inputs.version }}

  pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    permissions:
      # Mandatory for trusted publishing.
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.release.outputs.package }}
    steps:
      - name: Fetch the distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # A re-run finds the version it uploaded before.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: GitHub release
    needs: [release, pypi]
    permissions:
      contents: write
    uses: HairingX/workflows/.github/workflows/python-github-release.yml@v2
    with:
      tag: ${{ needs.release.outputs.tag }}
      prerelease: ${{ needs.release.outputs.prerelease }}
      previous_tag: ${{ needs.release.outputs.previous_tag }}
      draft_id: ${{ needs.release.outputs.draft_id }}
      draft_body: ${{ needs.release.outputs.draft_body }}
