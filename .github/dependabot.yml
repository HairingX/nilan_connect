# Proposes updates to the pinned actions and test tools as pull requests, which the tests then
# check before anything is merged.
#
# Shared by every library of the owner, from HairingX/workflows; this file is a copy of its
# template and is checked to stay so.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    assignees:
      - HairingX

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    assignees:
      - HairingX
